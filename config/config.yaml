# experiment params
NAME_INITIALS: "RE"
NUM_SEEDS: 3
SEED: 1

# wandb params
WANDB_MODE: "online"  # set to online to activate wandb
ENTITY: "jaxatari"
PROJECT: "jaxtari-blines-cameraready"

# where to save the params (if None, will not save)
SAVE_PATH: "./models"
# upload the final checkpoint to wandb as a model artifact (needs SAVE_PATH)
WANDB_SAVE_MODEL: False
# upload to huggingface
UPLOAD_MODEL: False

# default env
ENV_ID: pong

# AtariWrapper (environment protocol). The defaults are the DQN-style setup; Machado et al. (2018):
# STICKY_ACTIONS=0.25 EPISODIC_LIFE=False NOOP_MAX=0. Evaluation uses the same values, except that
# episodic life is always off there.
STICKY_ACTIONS: 0.0
EPISODIC_LIFE: True  # life loss ends the training episode (no reset)
NOOP_MAX: 30  # random number of no-ops on reset, 0 = off
FIRST_FIRE: True

# choose mods to be active during training, default: None
TRAIN_MODS: []
# choose mods to be evaluated after training
EVAL_MODS: []

# eval every N steps during training
EVAL_DURING_TRAIN: False
EVAL_EVERY: 100 # measured in alg iterations, not env steps
# whether to capture a video during eval
CAPTURE_VIDEO: True
# cap on the eval video length in frames (null = whole first episode); encoding is CPU-bound
VIDEO_MAX_FRAMES: null

# conv encoder for pixel-based runs: "nature" (Mnih et al., 2015) or "impala" (Espeholt et al., 2018); ignored for OC
CNN_TYPE: nature

# OCCAM (Blüml et al., 2025) for pixel-based runs: object masks instead of frames.
# null = plain frames, or one of binary | object | class | planes | opc (planes + grayscale frame); ignored for OC
OCCAM_MASK: null

# ORCA / ORBiT for object-centric runs, PPO and PQN only; ignored for pixel runs.
# ORCA: an anchor-relative object matrix (one row per object slot: one-hot class, dx, dy, center x/y,
# no frame stack) instead of the stacked object vector, normalised and flattened for the MLP.
# ORBIT: the ORCA matrix with a transformer over the objects instead of the MLP (implies ORCA).
ORCA: False
ORBIT: False
ORCA_ANCHOR: auto  # the game's ObjectObservation field positions are relative to; auto = the player (chicken, bailey, ship, skier); '' = absolute
ORCA_INCLUDE_WH: False  # add object width and height to each row
ORBIT_EMB_DIM: 128
ORBIT_NUM_HEADS: 8
ORBIT_NUM_BLOCKS: 3
ORBIT_POOLING: mean  # mean | max | first
ORBIT_NUM_POST_LAYERS: 0

# reward machines (Toro Icarte et al., 2018) for object-centric runs: the game's RM
# (reward_machines/) pays the reward and its state is appended to the observation;
# evaluation still scores the game reward. RM_SHAPING adds potential-based shaping.
REWARD_MACHINE: False
RM_SHAPING: False
